<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos Vía Pública</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 1.3rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #666;
    margin-top: 0;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  input#buscador {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .categoria {
    font-weight: 600;
    margin: 20px 0 8px;
    color: #333;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    background: white;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  li a {
    display: block;
    padding: 14px 16px;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 1rem;
  }
  li a:active {
    background: #eee;
  }
  .vacio {
    color: #999;
    font-size: 0.85rem;
    padding: 8px 16px;
  }
  #sin-resultados {
    display: none;
    color: #999;
    padding: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Permisos Vía Pública</h1>
<p class="subtitle">Buscá el municipio o country para ver la autorización vigente</p>

<input type="text" id="buscador" placeholder="Buscar municipio o country..." oninput="filtrar()">

<div id="contenido">

  <div class="categoria">Municipios</div>
  <ul id="lista-municipios">
    <li><a href="https://drive.google.com/drive/folders/1CC0QptzZfulC8XwNqFBqRJKli1Xx_tdw" target="_blank">San Isidro</a></li>
  </ul>

  <div class="categoria">Countries y Barrios Privados</div>
  <ul id="lista-countries">
    <li class="vacio">Todavía no hay countries cargados</li>
  </ul>

</div>

<div id="sin-resultados">No se encontraron resultados</div>

<script>
function filtrar() {
  const texto = document.getElementById('buscador').value.toLowerCase();
  const items = document.querySelectorAll('#contenido li');
  let visibles = 0;
  items.forEach(li => {
    const coincide = li.textContent.toLowerCase().includes(texto);
    li.style.display = coincide ? '' : 'none';
    if (coincide) visibles++;
  });
  document.getElementById('sin-resultados').style.display = (visibles === 0) ? 'block' : 'none';
}
</script>

</body>
</html>
